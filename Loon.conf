# =====================================
# Remote Filter
# (?i)：表示后面整个括号内的表达式不区分大小写
# =====================================
[Remote Filter]
# "非大陆使用"为排除节点，可以自定义
AUTO_Main_Filter = NameRegex, FilterKey = "^(?:(?!客户端|套餐|流量|更新|电报|失联).)*\].*$"
AUTO_Backup_Filter = NameRegex, FilterKey = "^(?:(?!客户端|套餐|流量|更新|电报|失联|\]).)*$"
# OT_Filter = NameRegex, FilterKey = "(?i)^(?!.*(?:非大陆使用|US|TW|JP|SG|美|韩|日本|新|港|台|英|🇬🇧|🇺🇸|🇸🇬|🇯🇵|🇭🇰|🇰🇷)).*$"
# HK_Filter = NameRegex, FilterKey = "(?i)^(?!.*非大陆使用).*(🇭🇰|港|HK).*$"
# TW_Filter = NameRegex, FilterKey = "(?i)^(?!.*非大陆使用).*(台|TW|Tai).*$"
# KR_Filter = NameRegex, FilterKey = "(?i)^(?!.*非大陆使用).*(🇰🇷|KR|Korea|KOR|首尔|韩|韓).*$"
US_Filter = NameRegex, FilterKey = "\[[0-9a-zA-Z]*\]美国"
JP_Filter = NameRegex, FilterKey = "\[[0-9a-zA-Z]*\]日本"
SG_Filter = NameRegex, FilterKey = "\[[0-9a-zA-Z]*\]新加坡"
US_BK_Filter = NameRegex, FilterKey = "^[^\]]*美国[^\]]*$"
JP_BK_Filter = NameRegex, FilterKey = "^[^\]]*日本[^\]]*$"
SG_BK_Filter = NameRegex, FilterKey = "^[^\]]*新加坡[^\]]*$"

#AI_Main_Filter = NameRegex, FilterKey = "(?i)(US)-\d\d-.*"
#AI_Backup_Filter = NameRegex, FilterKey = "(?i)^(?!.*(IPv6))(((日本|美国|新加坡).*(aws|BGP))|((hy2|trojan|vless).*(日本|美国|新加坡))).*$"
ALL_Filter = NameRegex, FilterKey = ".*"
ALL_AI_Filter = NameRegex, FilterKey = "(?i)(日本|美国|新加坡|JP|US|SG)"


# =====================================
# Rule
# Options:no-resolve(only for cidr)
# =====================================
[Rule]
# 当配置文件中没有任何有效策略组时，Loon将使用内置的PROXY策略组
# 当配置文件中存在有效的策略组时，内置的PROXY策略组将不再允许被调用，仅可使用用户配置的策略组
# 配置文件已自带远程GEOIP, cn, DIRECT规则，请勿在此添加
# 请勿修改远程CN REGION规则的排序甚至删除
IP-CIDR, 28.0.0.1/8, DIRECT
IP-CIDR, 198.18.0.1/16, DIRECT
IP-CIDR, 198.18.0.0/15, DIRECT
IP-CIDR6, fc00::/18, DIRECT
# 兜底策略
FINAL,漏网之鱼


